# Builds the Windows and Mac downloads (scripts/package-release.sh) and puts them
# on one release, so the demo site's links always get the newest version:
#   https://github.com/<owner>/<repo>/releases/latest/download/PaperLab-Windows.zip
name: Downloads

on:
  push:
    branches: [main]
    paths: [src/**, public/**, notes/**, launcher/**, package.json, README.md, SETUP.md, scripts/package-release.sh, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the downloads
        run: sh scripts/package-release.sh dist
      - name: Replace the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete download --cleanup-tag --yes || true
          gh release create download dist/PaperLab-Windows.zip dist/PaperLab-Mac.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Paper Lab download" \
            --notes "Paper Lab for your own computer, built from the latest version. Paper trading only: it never connects to a wallet or places a real trade. Windows: unzip, then double-click Start Paper Lab (Node is included). Mac: install Node from nodejs.org once, unzip, then right-click Start Paper Lab.command and choose Open. Full steps: SETUP.md."
