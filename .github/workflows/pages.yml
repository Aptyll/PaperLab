# Publishes the demo site (a recorded session, see scripts/export-demo.js) to GitHub Pages.
name: Demo site

on:
  push:
    branches: [main]
    paths: [public/**, demo/**, scripts/build-site.js, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for a saved session
        id: saved
        run: |
          if [ -f demo/data/manifest.json ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No session saved in demo/data yet; nothing to publish."; fi
      - if: steps.saved.outputs.ok == 'true'
        run: node scripts/build-site.js
      - if: steps.saved.outputs.ok == 'true'
        uses: actions/configure-pages@v5
      - if: steps.saved.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.saved.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
