<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Lab</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">PAPER LAB</a>
    <span class="badge-paper" title="No wallet, no real orders. Every trade here is simulated.">PAPER</span>
    <nav class="nav">
      <a href="#/" data-nav="home">Scoreboard</a>
      <a href="#/coins" data-nav="coins">Coins</a>
    </nav>
    <select id="run-pick" class="run-pick" hidden title="Each change to the trading rules starts a new run. Earlier runs stay here."></select>
    <span class="spacer"></span>
    <span id="live-ctl"></span>
    <span id="health" class="health-text muted">connecting…</span>
    <button type="button" id="quit" class="btn-icon" title="Quit Paper Lab (stops everything)" aria-label="Quit Paper Lab">⏻</button>
  </header>

  <main id="view" class="view"></main>

  <footer class="footer muted">
    Simulated trades only. Data: <a href="https://www.geckoterminal.com" target="_blank" rel="noopener">GeckoTerminal</a>.
    Charts: <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a>.
  </footer>

  <script src="/vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
